name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Releases are never cancelled halfway; the group only keeps two runs for the
# same tag from publishing at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the tag format
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG" =~ $pattern ]]; then
            echo "::error title=Invalid release tag::The tag '${TAG}' does not match ${pattern}. Use vMAJOR.MINOR.PATCH, optionally followed by a pre-release suffix such as -rc.1."
            exit 1
          fi
          echo "Tag '${TAG}' is valid."

  # The same jobs that gate pull requests: lint, tests, cross build and Docker build.
  verify:
    name: Verify
    needs: validate-tag
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "0"
    strategy:
      matrix:
        # Keep this list in sync with the cross build job in build.yml and with
        # the assets the installer downloads (.installer/install.sh).
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi
          OUTPUT="gowatch_${GOOS}_${GOARCH}${EXT}"
          go build -trimpath -ldflags="-s -w" -o "$OUTPUT" ./cmd/gowatch
          echo "ASSET_NAME=$OUTPUT" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gowatch_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gowatch_*
          merge-multiple: true
          path: release

      # The asset names and the CHECKSUMS.txt format are what .installer/install.sh
      # expects: gowatch_<os>_<arch> (.exe on Windows) and "<sha256>  <name>" lines.
      - name: Prepare release assets
        working-directory: release
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              if [ "$os" = "windows" ]; then
                ext=".exe"
              fi
              asset="gowatch_${os}_${arch}${ext}"
              if [ ! -f "$asset" ]; then
                echo "::error title=Missing release asset::${asset} was not built"
                exit 1
              fi
            done
          done
          sha256sum gowatch_* > CHECKSUMS.txt
          echo "Release assets:"
          ls -lah
          echo ""
          echo "Checksums:"
          cat CHECKSUMS.txt

      - name: Verify checksums
        working-directory: release
        run: sha256sum -c CHECKSUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release/*
