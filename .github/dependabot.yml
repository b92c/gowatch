version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      go-dependencies:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/.setup/build"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    # The Go version in the builder image must match go.mod and the
    # go-version used by the workflows, so a Go minor or major upgrade is
    # done by hand in all of them at once.
    ignore:
      - dependency-name: "docker/library/golang"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      docker-images:
        update-types:
          - "minor"
          - "patch"
